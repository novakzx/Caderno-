# Compila o Caderno+ no Windows (MSVC + Qt 6) e publica uma pasta pronta
# para rodar. Como usar: veja a seção "Build na nuvem" do README.md.
#
# Roda sozinho a cada push e também manualmente (aba Actions > Build Windows > Run workflow).
# Quando o push é uma etiqueta "v1.2.3", além de compilar publica uma Release no GitHub com o
# instalador (veja docs/GUIA-PUBLICAR.md, "Lançar uma versão").
name: Build Windows

on:
  push:
  workflow_dispatch:

# O token do workflow só pode LER o repositório (princípio do menor privilégio).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Ações de terceiros fixadas pelo hash do commit (o comentário diz a versão): uma mudança futura
      # na versão "v4" não entra no nosso build sem a gente ver.
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # O QXlsx (importar/exportar Excel) fica em third_party/QXlsx, como o CMakeLists.txt espera.
      # Se você já incluiu essa pasta no repositório, este passo não faz nada.
      - name: Baixar o QXlsx
        shell: pwsh
        run: |
          if (-not (Test-Path third_party/QXlsx/QXlsx/CMakeLists.txt)) {
            # Versão fixa (hash do commit), não "o que estiver no master": evita que uma alteração
            # futura (ou maliciosa) no repositório do QXlsx entre no nosso build.
            $qxlsx = "4e82d6c0726dcc39020cc5491d0de77f787c18ef"
            git init third_party/QXlsx
            git -C third_party/QXlsx fetch --depth 1 https://github.com/QtExcel/QXlsx $qxlsx
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git -C third_party/QXlsx checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Instalar o Qt 6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configurar (CMake)
        shell: pwsh
        run: |
          $curto = $env:GITHUB_SHA.Substring(0, 7)
          cmake -S . -B build -A x64 -DBUILD_SHARED_LIBS=OFF "-DPROFORG_BUILD_ID=$curto"

      # Se a compilação falhar, as linhas com "error" viram uma anotação na página do build
      # (assim os erros aparecem sem precisar abrir o log inteiro).
      - name: Compilar
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel *> build.log
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) {
            Get-Content build.log -Tail 120 | Write-Host
            $erros = Select-String -Path build.log -Pattern "error [A-Z]+\d+|error:|fatal error|undefined reference|unresolved external" |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 25
            $texto = ($erros -join "`n")
            $anotacao = ($texto -replace "%", "%25") -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=Erros de compilacao::$anotacao"
          }
          exit $codigo

      - name: Rodar os testes
        run: ctest --test-dir build -C Release --output-on-failure

      # windeployqt copia para a pasta do .exe as DLLs do Qt e os plugins que ele precisa
      # (inclusive o driver do SQLite), para rodar em qualquer PC sem instalar o Qt.
      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ProfOrganizer | Out-Null
          Copy-Item build/Release/ProfOrganizer.exe dist/ProfOrganizer/
          # A fonte Figtree está embutida no .exe; a licença dela (SIL OFL) acompanha o pacote.
          Copy-Item resources/fonts/OFL.txt dist/ProfOrganizer/Figtree-OFL.txt
          windeployqt --release --no-translations --no-system-d3d-compiler dist/ProfOrganizer/ProfOrganizer.exe
          Get-ChildItem dist/ProfOrganizer -Recurse | Measure-Object Length -Sum |
            ForEach-Object { "{0} arquivos, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }

      # Autoteste: roda o .exe empacotado (sem janela) para abrir um banco novo, aplicar as
      # migrações e exercitar todos os repositórios. Se falhar, mostra o relatório completo
      # (também como anotação na página do build) e o passo fica vermelho.
      - name: Autoteste (abre o banco e exercita os repositórios)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/ProfOrganizer/ProfOrganizer.exe").Path
          $saida = Join-Path $env:RUNNER_TEMP "autoteste.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", $saida -Wait -PassThru
          if (Test-Path $saida) {
            $texto = Get-Content $saida -Raw -Encoding UTF8
            Copy-Item $saida "dist/ProfOrganizer/autoteste.txt"
          } else {
            $texto = "O autoteste nao gerou relatorio (codigo de saida $($p.ExitCode))."
          }
          # Resumo curto: só o que NÃO está "OK" (cabeçalho, falhas, variantes e resultado).
          # O relatório completo continua no artefato (autoteste.txt).
          $linhas = $texto -split "`r?`n"
          $totalOk = ($linhas | Where-Object { $_ -match '^\s+OK\s' }).Count
          $compacto = (($linhas | Where-Object { $_ -notmatch '^\s+OK\s' }) -join "`n").Trim()
          $compacto = "$compacto`n($totalOk verificacoes OK; relatorio completo no artefato)"
          Write-Host $compacto
          # Comandos de workflow: % vira %25 e quebra de linha vira %0A.
          $anotacao = ($compacto -replace "%", "%25") -replace "`r", "" -replace "`n", "%0A"
          if ($p.ExitCode -ne 0) {
            Write-Host "::error title=Autoteste falhou::$anotacao"
            exit 1
          }
          Write-Host "::notice title=Autoteste passou::$anotacao"

      # Instalador próprio do Caderno+ (installer/setup: um .exe só, sem dependências), pacote portátil (.zip)
      # e hashes SHA-256, tudo em release/. Em etiqueta "vX.Y.Z" a versão vem dela (e precisa bater com o
      # CMakeLists.txt); nos demais builds vira "dev-<commit>".
      - name: Compilar o instalador
        shell: pwsh
        run: |
          cmake -S installer/setup -B build-setup -A x64
          cmake --build build-setup --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Montar e testar o instalador
        id: instalador
        shell: pwsh
        env:
          TIPO_REF: ${{ github.ref_type }}
          NOME_REF: ${{ github.ref_name }}
        run: |
          $curto = $env:GITHUB_SHA.Substring(0, 7)
          $versaoCmake = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(ProfOrganizer VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if ($env:TIPO_REF -eq "tag") {
            if ($env:NOME_REF -notmatch '^v(\d+\.\d+\.\d+)$') {
              Write-Host "::error title=Etiqueta invalida::A etiqueta '$($env:NOME_REF)' precisa ter o formato v1.2.3."
              exit 1
            }
            $versao = $Matches[1]
            if ($versao -ne $versaoCmake) {
              Write-Host "::error title=Versao diferente::A etiqueta e v$versao, mas o CMakeLists.txt esta na versao $versaoCmake. Ajuste e crie a etiqueta de novo."
              exit 1
            }
          } else {
            $versao = "dev-$curto"
          }

          New-Item -ItemType Directory -Force release | Out-Null
          python installer/empacotar.py --stub build-setup/Release/CadernoSetup.exe --pasta dist/ProfOrganizer --versao $versao --saida "release/Caderno-Setup-$versao.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Teste de ponta a ponta, sem janela: instala, confere, atualiza por cima, recusa pacote corrompido/malicioso e desinstala.
          & installer/testar-instalador.ps1 -Instalador "release/Caderno-Setup-$versao.exe" -Stub build-setup/Release/CadernoSetup.exe `
            -PastaDoPrograma dist/ProfOrganizer -Trabalho "$env:RUNNER_TEMP/teste-instalador"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Teste do instalador falhou::veja o log do passo"; exit 1 }

          Compress-Archive -Path dist/ProfOrganizer -DestinationPath "release/Caderno-$versao-portatil.zip"
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt | Write-Host
          "versao=$versao" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # O nome inclui o número da execução e o início do commit, para nunca confundir
      # o .exe novo com um antigo. O mesmo identificador aparece na barra de título do app.
      # (always: o pacote é publicado mesmo se o autoteste falhar, junto com o autoteste.txt.)
      - name: Nome do pacote
        id: nome
        if: always()
        shell: pwsh
        run: |
          $curto = $env:GITHUB_SHA.Substring(0, 7)
          "pacote=ProfOrganizer-build-$($env:GITHUB_RUN_NUMBER)-$curto" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "instalador=Instalador-build-$($env:GITHUB_RUN_NUMBER)-$curto" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publicar o resultado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.nome.outputs.pacote }}
          path: dist/ProfOrganizer
          if-no-files-found: error

      # Instalador + .zip portátil + SHA256SUMS.txt (é o que a Release publica).
      - name: Publicar o instalador
        if: steps.instalador.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.nome.outputs.instalador }}
          path: release
          if-no-files-found: error

  # Só roda quando o push é uma etiqueta "v...". É o único trecho com permissão de ESCRITA
  # (para criar a Release); não executa código do repositório, só publica o que o build gerou.
  publicar:
    name: Publicar a Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o instalador gerado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: Instalador-build-*
          path: release
          merge-multiple: true

      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          ls -l release
          gh release create "$ETIQUETA" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Caderno+ ${ETIQUETA#v}" \
            --generate-notes
