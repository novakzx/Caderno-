# Compila o Caderno+ no Windows (MSVC + Qt 6) e publica uma pasta pronta
# para rodar. Como usar: veja a seção "Build na nuvem" do README.md.
#
# Roda sozinho a cada push e também manualmente (aba Actions > Build Windows > Run workflow).
name: Build Windows

on:
  push:
  workflow_dispatch:

# O token do workflow só pode LER o repositório (princípio do menor privilégio).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Ações de terceiros fixadas pelo hash do commit (o comentário diz a versão): uma mudança futura
      # na versão "v4" não entra no nosso build sem a gente ver.
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # O QXlsx (importar/exportar Excel) fica em third_party/QXlsx, como o CMakeLists.txt espera.
      # Se você já incluiu essa pasta no repositório, este passo não faz nada.
      - name: Baixar o QXlsx
        shell: pwsh
        run: |
          if (-not (Test-Path third_party/QXlsx/QXlsx/CMakeLists.txt)) {
            # Versão fixa (hash do commit), não "o que estiver no master": evita que uma alteração
            # futura (ou maliciosa) no repositório do QXlsx entre no nosso build.
            $qxlsx = "4e82d6c0726dcc39020cc5491d0de77f787c18ef"
            git init third_party/QXlsx
            git -C third_party/QXlsx fetch --depth 1 https://github.com/QtExcel/QXlsx $qxlsx
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git -C third_party/QXlsx checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Instalar o Qt 6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configurar (CMake)
        shell: pwsh
        run: |
          $curto = $env:GITHUB_SHA.Substring(0, 7)
          cmake -S . -B build -A x64 -DBUILD_SHARED_LIBS=OFF "-DPROFORG_BUILD_ID=$curto"

      # Se a compilação falhar, as linhas com "error" viram uma anotação na página do build
      # (assim os erros aparecem sem precisar abrir o log inteiro).
      - name: Compilar
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel *> build.log
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) {
            Get-Content build.log -Tail 120 | Write-Host
            $erros = Select-String -Path build.log -Pattern "error [A-Z]+\d+|error:|fatal error|undefined reference|unresolved external" |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 25
            $texto = ($erros -join "`n")
            $anotacao = ($texto -replace "%", "%25") -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=Erros de compilacao::$anotacao"
          }
          exit $codigo

      - name: Rodar os testes
        run: ctest --test-dir build -C Release --output-on-failure

      # windeployqt copia para a pasta do .exe as DLLs do Qt e os plugins que ele precisa
      # (inclusive o driver do SQLite), para rodar em qualquer PC sem instalar o Qt.
      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ProfOrganizer | Out-Null
          Copy-Item build/Release/ProfOrganizer.exe dist/ProfOrganizer/
          # A fonte Figtree está embutida no .exe; a licença dela (SIL OFL) acompanha o pacote.
          Copy-Item resources/fonts/OFL.txt dist/ProfOrganizer/Figtree-OFL.txt
          windeployqt --release --no-translations --no-system-d3d-compiler dist/ProfOrganizer/ProfOrganizer.exe
          Get-ChildItem dist/ProfOrganizer -Recurse | Measure-Object Length -Sum |
            ForEach-Object { "{0} arquivos, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }

      # Autoteste: roda o .exe empacotado (sem janela) para abrir um banco novo, aplicar as
      # migrações e exercitar todos os repositórios. Se falhar, mostra o relatório completo
      # (também como anotação na página do build) e o passo fica vermelho.
      - name: Autoteste (abre o banco e exercita os repositórios)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/ProfOrganizer/ProfOrganizer.exe").Path
          $saida = Join-Path $env:RUNNER_TEMP "autoteste.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", $saida -Wait -PassThru
          if (Test-Path $saida) {
            $texto = Get-Content $saida -Raw -Encoding UTF8
            Copy-Item $saida "dist/ProfOrganizer/autoteste.txt"
          } else {
            $texto = "O autoteste nao gerou relatorio (codigo de saida $($p.ExitCode))."
          }
          # Resumo curto: só o que NÃO está "OK" (cabeçalho, falhas, variantes e resultado).
          # O relatório completo continua no artefato (autoteste.txt).
          $linhas = $texto -split "`r?`n"
          $totalOk = ($linhas | Where-Object { $_ -match '^\s+OK\s' }).Count
          $compacto = (($linhas | Where-Object { $_ -notmatch '^\s+OK\s' }) -join "`n").Trim()
          $compacto = "$compacto`n($totalOk verificacoes OK; relatorio completo no artefato)"
          Write-Host $compacto
          # Comandos de workflow: % vira %25 e quebra de linha vira %0A.
          $anotacao = ($compacto -replace "%", "%25") -replace "`r", "" -replace "`n", "%0A"
          if ($p.ExitCode -ne 0) {
            Write-Host "::error title=Autoteste falhou::$anotacao"
            exit 1
          }
          Write-Host "::notice title=Autoteste passou::$anotacao"

      # O nome inclui o número da execução e o início do commit, para nunca confundir
      # o .exe novo com um antigo. O mesmo identificador aparece na barra de título do app.
      # (always: o pacote é publicado mesmo se o autoteste falhar, junto com o autoteste.txt.)
      - name: Nome do pacote
        id: nome
        if: always()
        shell: pwsh
        run: |
          $curto = $env:GITHUB_SHA.Substring(0, 7)
          "pacote=ProfOrganizer-build-$($env:GITHUB_RUN_NUMBER)-$curto" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publicar o resultado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.nome.outputs.pacote }}
          path: dist/ProfOrganizer
          if-no-files-found: error
